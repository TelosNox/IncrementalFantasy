<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -95 760 445" width="1140" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Buehnen-Framework der Kampfzone (alle Masse in Stage-Units)</title>

  <defs>
    <pattern id="bleed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e7e2d6"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c3bcab" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="-150" y="-95" width="760" height="445" fill="#fbfaf7"/>

  <!-- Bleed-Zonen -->
  <rect x="-96" y="-72" width="672" height="360" fill="url(#bleed)"/>
  <text x="-48" y="150" font-size="9" fill="#8a8271" text-anchor="middle" transform="rotate(-90 -48 150)">Bleed 96 su (32 px)</text>
  <text x="528" y="150" font-size="9" fill="#8a8271" text-anchor="middle" transform="rotate(-90 528 150)">Bleed 96 su (32 px)</text>
  <text x="240" y="-56" font-size="9" fill="#8a8271" text-anchor="middle">Bleed 72 su (24 px) — Himmel wird fortgesetzt, kein fokales Motiv</text>

  <!-- Baender -->
  <rect x="0" y="0" width="480" height="72" fill="#cfe0ee"/>
  <rect x="0" y="72" width="480" height="120" fill="#e4eef5"/>
  <rect x="0" y="192" width="480" height="96" fill="#cbb392"/>

  <!-- Standlinien -->
  <line x1="0" y1="228" x2="480" y2="228" stroke="#7c6242" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="0" y1="252" x2="480" y2="252" stroke="#7c6242" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Slots: hintere Reihe zuerst -->
  <g fill="#9fb0c6" stroke="#5c6b80" stroke-width="1" opacity="0.95">
    <rect x="48"  y="164" width="64" height="64"/>
    <rect x="128" y="164" width="64" height="64"/>
    <rect x="256" y="164" width="64" height="64"/>
    <rect x="336" y="164" width="64" height="64"/>
  </g>
  <g fill="#8fa2ba" stroke="#3f4c5e" stroke-width="1">
    <rect x="80"  y="188" width="64" height="64"/>
    <rect x="160" y="188" width="64" height="64"/>
    <rect x="288" y="188" width="64" height="64"/>
    <rect x="368" y="188" width="64" height="64"/>
  </g>
  <g font-size="11" fill="#1f2229" text-anchor="middle" font-weight="600">
    <text x="80"  y="202">P4</text><text x="160" y="202">P2</text>
    <text x="112" y="226">P3</text><text x="192" y="226">P1</text>
    <text x="288" y="202">E2</text><text x="368" y="202">E4</text>
    <text x="320" y="226">E1</text><text x="400" y="226">E3</text>
  </g>

  <!-- Tiefenvektor D -->
  <g stroke="#b4472f" stroke-width="1.6" fill="none">
    <path d="M 192 252 L 160 228"/>
    <path d="M 160 228 l 5 -1 l -4 -4" stroke-linecap="round"/>
  </g>
  <text x="196" y="243" font-size="9" fill="#b4472f" font-weight="600">D = (−32, −24)</text>

  <!-- Bühnenbox -->
  <rect x="0" y="0" width="480" height="288" fill="none" stroke="#20242e" stroke-width="2"/>
  <text x="240" y="-14" font-size="13" fill="#20242e" text-anchor="middle" font-weight="700">Bühnenbox 480 × 288 su  ·  1 su = 1 Sprite-Pixel = ⅓ Backdrop-Pixel</text>

  <!-- y-Achse -->
  <g font-size="10" fill="#4a4a4a" text-anchor="end">
    <text x="-8" y="4">0</text>
    <text x="-8" y="76">72</text>
    <text x="-8" y="196">192</text>
    <text x="-8" y="232">228</text>
    <text x="-8" y="256">252</text>
    <text x="-8" y="292">288</text>
  </g>
  <g stroke="#9a9a9a" stroke-width="0.6">
    <line x1="-6" y1="0" x2="0" y2="0"/><line x1="-6" y1="72" x2="0" y2="72"/>
    <line x1="-6" y1="192" x2="0" y2="192"/><line x1="-6" y1="228" x2="0" y2="228"/>
    <line x1="-6" y1="252" x2="0" y2="252"/><line x1="-6" y1="288" x2="0" y2="288"/>
  </g>

  <!-- Bandbeschriftung -->
  <g font-size="11" fill="#20242e">
    <text x="10" y="24" font-weight="600">Himmelband · B0/B1</text>
    <text x="10" y="38" font-size="9" fill="#4a5560">kein Sprite, kein HUD</text>
    <text x="10" y="92" font-weight="600">Figurenband</text>
    <text x="10" y="106" font-size="9" fill="#4a5560">Sprite-Körper + 24 su HUD-Kopfraum</text>
    <text x="10" y="212" font-weight="600">Bodenband · B2 — untere 32 Backdrop-Pixel</text>
  </g>
  <g font-size="9" fill="#5b4a33" text-anchor="end">
    <text x="474" y="226">Standlinie hinten B₂ = 228</text>
    <text x="474" y="250">Standlinie vorn B₁ = 252</text>
    <text x="474" y="284">Reserve 36 su</text>
    <text x="474" y="206">Reserve 36 su · Bodenkante G = 192</text>
  </g>

  <!-- Deckenlinie -->
  <line x1="0" y1="72" x2="480" y2="72" stroke="#20242e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="474" y="68" font-size="9" fill="#20242e" text-anchor="end">Deckenlinie — Sprite-Oberkante + 24 su HUD bleibt darunter</text>

  <!-- Boss-Gegenprobe -->
  <rect x="280" y="100" width="128" height="128" fill="none" stroke="#b4472f" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="344" y="96" font-size="9" fill="#b4472f" text-anchor="middle" font-weight="600">Kapitel-Boss 128 su, Solo-Slot x = 344</text>

  <!-- x-Achse -->
  <g font-size="9" fill="#4a4a4a" text-anchor="middle">
    <text x="80" y="304">80</text><text x="112" y="304">112</text>
    <text x="160" y="304">160</text><text x="192" y="304">192</text>
    <text x="240" y="316" font-weight="600">Bühnenmitte 240 — Aufstellung ist symmetrisch</text>
    <text x="288" y="304">288</text><text x="320" y="304">320</text>
    <text x="368" y="304">368</text><text x="400" y="304">400</text>
  </g>

  <!-- Skalierungsregel -->
  <text x="0" y="338" font-size="11" fill="#20242e">
    s = min(Stage-Breite / 480, Stage-Höhe / 288), begrenzt auf 1,0 … 4,0 — ein Faktor für Backdrop, Sprites, Marker und HUD. Referenzfall s = 2.
  </text>
</svg>
