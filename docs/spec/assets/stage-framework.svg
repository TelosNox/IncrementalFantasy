<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -125 800 500" width="1200" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Buehnen-Framework der Kampfzone (alle Masse in Stage-Units)</title>

  <defs>
    <pattern id="bleed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e7e2d6"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c3bcab" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="-160" y="-125" width="800" height="500" fill="#fbfaf7"/>

  <!-- Bleed-Zonen: 28 px seitlich = 84 su, 32 px oben = 96 su -->
  <rect x="-84" y="-96" width="672" height="384" fill="url(#bleed)"/>
  <text x="-42" y="150" font-size="9" fill="#8a8271" text-anchor="middle" transform="rotate(-90 -42 150)">Bleed 84 su (28 px)</text>
  <text x="546" y="150" font-size="9" fill="#8a8271" text-anchor="middle" transform="rotate(-90 546 150)">Bleed 84 su (28 px)</text>
  <text x="252" y="-78" font-size="9" fill="#8a8271" text-anchor="middle">Bleed 96 su (32 px) — Himmel wird fortgesetzt, kein fokales Motiv</text>

  <!-- Baender -->
  <rect x="0" y="0" width="504" height="72" fill="#cfe0ee"/>
  <rect x="0" y="72" width="504" height="120" fill="#e4eef5"/>
  <rect x="0" y="192" width="504" height="96" fill="#cbb392"/>

  <!-- Standlinien -->
  <line x1="0" y1="228" x2="504" y2="228" stroke="#7c6242" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="0" y1="268" x2="504" y2="268" stroke="#7c6242" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Slots: hintere Reihe zuerst (Z-Reihenfolge) -->
  <g fill="#9fb0c6" stroke="#5c6b80" stroke-width="1" opacity="0.95">
    <rect x="64"  y="164" width="64" height="64"/>
    <rect x="184" y="164" width="64" height="64"/>
    <rect x="336" y="164" width="64" height="64"/>
    <rect x="416" y="164" width="64" height="64"/>
  </g>
  <g fill="#8fa2ba" stroke="#3f4c5e" stroke-width="1">
    <rect x="24"  y="204" width="64" height="64"/>
    <rect x="144" y="204" width="64" height="64"/>
    <rect x="296" y="204" width="64" height="64"/>
    <rect x="376" y="204" width="64" height="64"/>
  </g>
  <g font-size="11" fill="#1f2229" text-anchor="middle" font-weight="600">
    <text x="96"  y="202">P4</text><text x="216" y="202">P2</text>
    <text x="56"  y="242">P3</text><text x="176" y="242">P1</text>
    <text x="368" y="202">E2</text><text x="448" y="202">E4</text>
    <text x="328" y="242">E1</text><text x="408" y="242">E3</text>
  </g>

  <!-- Gruppenklammern -->
  <g stroke="#4a5560" stroke-width="0.8" fill="none">
    <path d="M 24 280 L 24 284 L 248 284 L 248 280"/>
    <path d="M 296 280 L 296 284 L 480 284 L 480 280"/>
  </g>
  <g font-size="8" fill="#4a5560" text-anchor="middle">
    <text x="136" y="294">Party 224 su · Slot-Abstand 120</text>
    <text x="388" y="294">Gegner 184 su · Slot-Abstand 80 (Pulk)</text>
    <text x="272" y="294">48</text>
  </g>

  <!-- Tiefenvektor D -->
  <g stroke="#b4472f" stroke-width="1.6" fill="none">
    <path d="M 176 268 L 216 228"/>
    <path d="M 216 228 l -6 1 l 5 5" stroke-linecap="round"/>
  </g>
  <text x="220" y="252" font-size="9" fill="#b4472f" font-weight="600">D = (+40, −40) — 45°, wie die Würfelkanten</text>

  <!-- Bühnenbox -->
  <rect x="0" y="0" width="504" height="288" fill="none" stroke="#20242e" stroke-width="2"/>
  <text x="252" y="-14" font-size="13" fill="#20242e" text-anchor="middle" font-weight="700">Bühnenbox 504 × 288 su (7:4)  ·  1 su = 1 Sprite-Pixel = ⅓ Backdrop-Pixel</text>

  <!-- y-Achse -->
  <g font-size="10" fill="#4a4a4a" text-anchor="end">
    <text x="-8" y="4">0</text>
    <text x="-8" y="76">72</text>
    <text x="-8" y="196">192</text>
    <text x="-8" y="232">228</text>
    <text x="-8" y="272">268</text>
    <text x="-8" y="292">288</text>
  </g>
  <g stroke="#9a9a9a" stroke-width="0.6">
    <line x1="-6" y1="0" x2="0" y2="0"/><line x1="-6" y1="72" x2="0" y2="72"/>
    <line x1="-6" y1="192" x2="0" y2="192"/><line x1="-6" y1="228" x2="0" y2="228"/>
    <line x1="-6" y1="268" x2="0" y2="268"/><line x1="-6" y1="288" x2="0" y2="288"/>
  </g>

  <!-- Bandbeschriftung -->
  <g font-size="11" fill="#20242e">
    <text x="10" y="24" font-weight="600">Himmelband · B0/B1</text>
    <text x="10" y="38" font-size="9" fill="#4a5560">kein Sprite, kein HUD</text>
    <text x="10" y="92" font-weight="600">Figurenband</text>
    <text x="10" y="106" font-size="9" fill="#4a5560">Sprite-Körper + 24 su HUD-Kopfraum</text>
    <text x="10" y="186" font-size="9" font-weight="600">Bodenband · B2 — untere 32 Backdrop-Pixel</text>
  </g>
  <g font-size="9" fill="#5b4a33" text-anchor="end">
    <text x="498" y="206">Reserve 36 su · Bodenkante G = 192</text>
    <text x="498" y="226">Standlinie hinten B₂ = 228</text>
    <text x="498" y="266">Standlinie vorn B₁ = 268</text>
    <text x="498" y="284">Reserve 20 su (Minimum)</text>
  </g>

  <!-- Deckenlinie -->
  <line x1="0" y1="72" x2="504" y2="72" stroke="#20242e" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="498" y="68" font-size="9" fill="#20242e" text-anchor="end">Deckenlinie — Sprite-Oberkante + 24 su HUD bleibt darunter</text>

  <!-- Boss-Gegenprobe -->
  <rect x="324" y="100" width="128" height="128" fill="none" stroke="#b4472f" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="388" y="96" font-size="9" fill="#b4472f" text-anchor="middle" font-weight="600">Kapitel-Boss 128 su, Solo-Slot x = 388</text>

  <!-- x-Achse -->
  <g font-size="8" text-anchor="middle">
    <g fill="#3f4c5e">
      <text x="56" y="310">56</text><text x="176" y="310">176</text>
      <text x="328" y="310">328</text><text x="408" y="310">408</text>
    </g>
    <g fill="#7d8ea6">
      <text x="96" y="320">96</text><text x="216" y="320">216</text>
      <text x="368" y="320">368</text><text x="448" y="320">448</text>
    </g>
  </g>
  <text x="252" y="336" font-size="9" fill="#4a4a4a" text-anchor="middle" font-weight="600">randbündig: 24 su Außenrand auf beiden Seiten — keine Mittensymmetrie, weil die Gruppen verschieden breit sind</text>

  <!-- Skalierungsregel -->
  <text x="0" y="358" font-size="11" fill="#20242e">
    s = min(Stage-Breite / 504, Stage-Höhe / 288), begrenzt auf 1,0 … 4,0 — ein Faktor für Backdrop, Sprites, Marker und HUD. Referenzfall s = 2.
  </text>
</svg>
